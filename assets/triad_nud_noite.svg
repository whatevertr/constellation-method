<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 640" role="img" aria-labelledby="tt dd" font-family="'IBM Plex Mono','JetBrains Mono',ui-monospace,'Courier New',monospace">
  <title id="tt">Triad NUD (noite)</title>
  <desc id="dd">Mini NUD harness of the Context Triad. An instance reads and edits two folders: the context folder (start_here = door, how_to_work_with_me = manual, function_[nickname] = role) and the memory folder.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="#7D6EB0"/></marker>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><line x1="0" y1="0" x2="4" y2="0" stroke="#B6B0C8" stroke-width="1" opacity="0.035"/></pattern>
    <radialGradient id="rad" cx="50%" cy="20%" r="92%"><stop offset="0%" stop-color="#2C2934"/><stop offset="62%" stop-color="#22202A"/><stop offset="100%" stop-color="#17141D"/></radialGradient>
    <filter id="glow" x="-20%" y="-60%" width="140%" height="220%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
  <rect width="2000" height="640" fill="url(#rad)"/><rect width="2000" height="640" fill="url(#scan)"/>
  <g font-family="'Share Tech Mono','IBM Plex Mono',monospace" font-size="36" letter-spacing="2">
      <text x="34.5" y="60" fill="#C8A2FF" opacity="0.9">TRIAD NUD</text>
      <text x="37.5" y="60" fill="#D97757" opacity="0.9">TRIAD NUD</text>
      <text x="36" y="60" fill="#E9E6F1" filter="url(#glow)">TRIAD NUD</text></g>
  <g>
    <text x="1958" y="60" text-anchor="end" font-family="'Share Tech Mono','IBM Plex Mono',monospace" font-size="24" letter-spacing="3.4" fill="#D2CEDF">NUD</text>
    <g transform="translate(1968,38.6) scale(0.4)">
      <path d="M24 11 L13 11 L13 53 L24 53" fill="none" stroke="#C8A2FF" stroke-width="5.5"/>
      <path d="M40 11 L51 11 L51 53 L40 53" fill="none" stroke="#C8A2FF" stroke-width="5.5"/>
      <circle cx="32" cy="32" r="7.5" fill="#FF8A5C"/></g></g>
  <rect x="80" y="150" width="620" height="400" fill="#17141D" stroke="#7D6EB0" stroke-width="1.5" rx="2"/><rect x="80" y="150" width="620" height="44" fill="#2C2934" rx="2"/><rect x="80" y="174" width="620" height="20" fill="#2C2934"/><line x1="80" y1="194" x2="700" y2="194" stroke="#393642" stroke-width="1"/><text x="390" y="179" text-anchor="middle" font-family="'IBM Plex Mono','JetBrains Mono',ui-monospace,'Courier New',monospace" font-size="15" letter-spacing="1" fill="#D2CEDF">Project folder or local folder</text><rect x="160" y="250" width="460" height="54" fill="#0E0C14" stroke="#393642" stroke-width="1" rx="2"/><text x="390" y="282" text-anchor="middle" font-family="'IBM Plex Mono','JetBrains Mono',ui-monospace,'Courier New',monospace" font-size="15" fill="#C8A2FF">function_[nickname].md</text><rect x="160" y="338" width="460" height="54" fill="#0E0C14" stroke="#393642" stroke-width="1" rx="2"/><text x="390" y="370" text-anchor="middle" font-family="'IBM Plex Mono','JetBrains Mono',ui-monospace,'Courier New',monospace" font-size="15" fill="#C8A2FF">how_to_work_with_me.md</text><rect x="160" y="426" width="460" height="54" fill="#0E0C14" stroke="#393642" stroke-width="1" rx="2"/><text x="390" y="458" text-anchor="middle" font-family="'IBM Plex Mono','JetBrains Mono',ui-monospace,'Courier New',monospace" font-size="15" fill="#C8A2FF">start_here.md</text>
