  <rect width="2000" height="640" fill="#C7BCB0"/>
  <g font-family="'Share Tech Mono','IBM Plex Mono',monospace" font-size="36" letter-spacing="2">
      <text x="34" y="58" fill="#642DA4" opacity="0.85" style="mix-blend-mode:multiply">TRIAD NUD</text>
      <text x="37.5" y="61.5" fill="#993700" opacity="0.85" style="mix-blend-mode:multiply">TRIAD NUD</text>
      <text x="36" y="60" fill="#191128">TRIAD NUD</text></g>
  <g>
